<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>How Would You Like To Feel?</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="screen" id="mainScreen">

      <h1>How would you like to feel?</h1>

      <p class="subtitle">
        Choose an option below.
      </p>

      <div class="buttons">

        <button
          class="choice-button calm-button"
          id="calmButton">
          Calm
        </button>

        <button
          class="choice-button nonchalant-button"
          id="nonchalantButton">
          Nonchalant
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
